.loader div{width:50%;height:100%;background:linear-gradient(90deg,#8b5cf6,#f59e0b);animation:ld 1s infinite linear}

.user{display:flex;gap:12px;align-items:center}

.purple{background:linear-gradient(135deg,#8b5cf6,#4c1d95);box-shadow:0 10px 25px rgba(139,92,246,.4)}
