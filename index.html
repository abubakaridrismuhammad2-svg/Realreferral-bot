const VIEW_COOLDOWN = 10 * 60 * 1000;
const FALLBACK_COOLDOWN = 2 * 60 * 1000;
window.canViewAgain = function(id, isFallback=false){
  let key = isFallback ? 'last_view_'+myId+'_fallback' : 'last_view_'+myId+'_'+id;
  let last = localStorage.getItem(key);
  if(!last) return true;
  let cd = isFallback ? FALLBACK_COOLDOWN : VIEW_COOLDOWN;
  return (Date.now() - parseInt(last)) >= cd;
}
window.getRemaining = function(id, isFallback=false){
  let key = isFallback ? 'last_view_'+myId+'_fallback' : 'last_view_'+myId+'_'+id;
  let last = localStorage.getItem(key);
  if(!last) return "";
  let cd = isFallback ? FALLBACK_COOLDOWN : VIEW_COOLDOWN;
  let rem = cd - (Date.now() - parseInt(last));
  if(rem <= 0) return "";
  let m = Math.floor(rem/60000);
  let s = Math.floor((rem%60000)/1000);
  return m>0 ? m+"m "+s+"s" : s+"s";
}
